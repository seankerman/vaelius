name: Release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install build ./packages/client './packages/server[cloud,semantic,cloud-test]'
      - name: Build and install matching release packages
        run: |
          python scripts/build.py
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip check
      - name: Start disposable services
        run: |
          docker build -f containers/Dockerfile.test-postgres -t vaelius-test-postgres:ci .
          python scripts/dev_services.py start --state "$RUNNER_TEMP/vaelius-services" --engine docker --postgres-image vaelius-test-postgres:ci
      - name: Installed unit and PostgreSQL regressions
        run: python scripts/test.py --installed --services "$RUNNER_TEMP/vaelius-services/services.json" --report "$RUNNER_TEMP/vaelius-tests.json"
      - name: Actual synthetic API and MCP delivery
        run: python scripts/demo.py --state "$RUNNER_TEMP/vaelius-services"
      - name: Public files and release artifact checks
        run: python scripts/check_public_files.py --artifacts dist
      - name: Secret scanning
        run: python scripts/scan_secrets.py
      - name: Stop disposable services
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vaelius-services/dev-services.json"; then
            python scripts/dev_services.py destroy --state "$RUNNER_TEMP/vaelius-services"
          fi
