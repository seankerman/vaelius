# Tag-triggered release: wheels, sdists, runtime image, CycloneDX SBOMs, and
# Sigstore-signed GitHub artifact attestations. See RELEASING.md.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write # store the signed attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tag, package versions and changelog agree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          import sys, tomllib
          for package in ('client', 'server'):
              with open(f'packages/{package}/pyproject.toml', 'rb') as handle:
                  version = tomllib.load(handle)['project']['version']
              if version != sys.argv[1]:
                  sys.exit(f'{package} version {version} does not match tag {sys.argv[1]}')
          PY
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$VERSION] section"; exit 1; }
      - name: Build with the hash-locked backend
        run: |
          python scripts/check_locks.py
          python -m pip install --require-hashes -r requirements-build.txt
          python scripts/build.py --no-isolation
          python scripts/check_public_files.py --artifacts dist
      - name: Install wheels for SBOM cataloguing
        run: |
          root="$RUNNER_TEMP/sbom-input"
          python -m pip install --no-deps --no-index --target "$root/client" dist/vaelius_client-*.whl
          python -m pip install --require-hashes --target "$root/server/dependencies" -r requirements-runtime.txt
          python -m pip install --no-deps --no-index --target "$root/server/project" dist/vaelius_server-*.whl dist/vaelius_client-*.whl
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Wheel SBOMs (CycloneDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          for package in client server; do
            "$SYFT" scan "dir:$RUNNER_TEMP/sbom-input/$package" \
              --source-name "vaelius-$package" --source-version "$VERSION" \
              -o "cyclonedx-json=sbom/vaelius-$package-$VERSION.cdx.json"
          done
      - name: Build provenance for wheels and sdists
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: SBOM attestation for the client wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vaelius_client-*.whl
          sbom-path: sbom/vaelius-client-${{ env.VERSION }}.cdx.json
      - name: SBOM attestation for the server wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vaelius_server-*.whl
          sbom-path: sbom/vaelius-server-${{ env.VERSION }}.cdx.json
      - name: Stage release files
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp dist/*.whl dist/*.tar.gz dist/manifest.json sbom/*.cdx.json "$RUNNER_TEMP/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing certificate
      attestations: write # store the signed attestations
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull pinned base image (retries ECR Public 429s)
        run: |
          ref=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' Dockerfile | sort -u)
          for attempt in 1 2 3 4 5; do
            docker pull --quiet "$ref" && exit 0
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build runtime image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          { echo "VERSION=$VERSION"; echo "IMAGE=$IMAGE"; } >> "$GITHUB_ENV"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "$IMAGE:$VERSION" .
      - name: Write Grype exceptions from osv-scanner.toml
        run: python3 scripts/vulnerability_policy.py --grype-config "$RUNNER_TEMP/grype.yaml"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Vulnerability gate before publishing
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" "docker:$IMAGE:$VERSION" --config "$RUNNER_TEMP/grype.yaml" \
            --only-fixed --fail-on high -o table
      - name: Image SBOM (CycloneDX)
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          "$SYFT" scan "docker:$IMAGE:$VERSION" --source-name vaelius --source-version "$VERSION" \
            -o "cyclonedx-json=$RUNNER_TEMP/release/vaelius-image-$VERSION.cdx.json"
      - name: Push to GitHub Container Registry
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          { echo "image=$IMAGE"; echo "digest=${reference#*@}"; } >> "$GITHUB_OUTPUT"
      - name: Build provenance for the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records are organization-only
      - name: SBOM attestation for the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release/vaelius-image-${{ env.VERSION }}.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [python-dist, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/release"
          sha256sum -- *.whl *.tar.gz *.cdx.json > SHA256SUMS
          awk -v v="$VERSION" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' \
            "$GITHUB_WORKSPACE/CHANGELOG.md" > notes.md
          {
            echo
            echo "Container image: \`$IMAGE:$VERSION\` (\`$IMAGE@$DIGEST\`)"
            echo
            echo "Verify signatures, provenance and SBOMs as described in [RELEASING.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/RELEASING.md#verifying-a-release)."
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Vaelius $VERSION" --notes-file notes.md \
            ./*.whl ./*.tar.gz ./*.cdx.json manifest.json SHA256SUMS
