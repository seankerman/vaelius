[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Generated module checksums, independently verified by check_public_files.py"
paths = ['packages/(client/agentclient|server/agenthub)/BUILD_ID\.json$']
regexTarget = "secret"
regexes = ['^[a-f0-9]{64}$']
